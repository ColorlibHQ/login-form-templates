<!DOCTYPE html>
<html lang="en">
<head>
	<title>Login V18</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="icon" type="image/png" href="images/icons/favicon.ico"/>

	<link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #666666;">

	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<form class="login100-form validate-form">
					<span class="login100-form-title p-b-43">
						Login to continue
					</span>

					<div class="wrap-input100 validate-input" data-validate = "Valid email is required: ex@abc.xyz">
						<input class="input100" type="text" name="email">
						<span class="focus-input100"></span>
						<span class="label-input100">Email</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate="Password is required">
						<input class="input100" type="password" name="pass">
						<span class="focus-input100"></span>
						<span class="label-input100">Password</span>
					</div>

					<div class="flex-sb-m w-full p-t-3 p-b-32">
						<div class="contact100-form-checkbox">
							<input class="input-checkbox100" id="ckb1" type="checkbox" name="remember-me">
							<label class="label-checkbox100" for="ckb1">
								Remember me
							</label>
						</div>

						<div>
							<a href="#" class="txt1">
								Forgot Password?
							</a>
						</div>
					</div>

					<div class="container-login100-form-btn">
						<button class="login100-form-btn">
							Login
						</button>
					</div>

					<div class="cl-text-center p-t-46 p-b-20">
						<span class="txt2">
							or sign up using
						</span>
					</div>

					<div class="login100-form-social flex-c-m">
						<a href="#" class="login100-form-social-item flex-c-m bg1 m-r-5">
							<i class="fa fa-facebook-f" aria-hidden="true"><svg class="cl-icon" viewBox="0 0 1024 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M959 1524V1260H802Q716 1260 686.0 1224.0Q656 1188 656 1116V927H949L910 631H656V-128H350V631H95V927H350V1145Q350 1331 454.0 1433.5Q558 1536 731 1536Q878 1536 959 1524Z"/></g></svg></i>
						</a>

						<a href="#" class="login100-form-social-item flex-c-m bg2 m-r-5">
							<i class="fa fa-twitter" aria-hidden="true"><svg class="cl-icon" viewBox="0 0 1664 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M1620 1128Q1553 1030 1458 961Q1459 947 1459 919Q1459 789 1421.0 659.5Q1383 530 1305.5 411.0Q1228 292 1121.0 200.5Q1014 109 863.0 54.5Q712 0 540 0Q269 0 44 145Q79 141 122 141Q347 141 523 279Q418 281 335.0 343.5Q252 406 221 503Q254 498 282 498Q325 498 367 509Q255 532 181.5 620.5Q108 709 108 826V830Q176 792 254 789Q188 833 149.0 904.0Q110 975 110 1058Q110 1146 154 1221Q275 1072 448.5 982.5Q622 893 820 883Q812 921 812 957Q812 1091 906.5 1185.5Q1001 1280 1135 1280Q1275 1280 1371 1178Q1480 1199 1576 1256Q1539 1141 1434 1078Q1527 1088 1620 1128Z"/></g></svg></i>
						</a>
					</div>
				</form>

				<div class="login100-more" style="background-image: url('images/bg-01.jpg');">
				</div>
			</div>
		</div>
	</div>

		<script src="js/snippet.js"></script>
</body>
</html>
