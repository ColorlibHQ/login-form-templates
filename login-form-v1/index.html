<!DOCTYPE html>
<html lang="en">
<head>
	<title>Login V1</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="icon" type="image/png" href="images/icons/favicon.ico"/>

	<link rel="stylesheet" href="css/style.css">
</head>
<body>

	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<div class="login100-pic js-tilt" data-tilt>
					<img src="images/img-01.png" alt="IMG">
				</div>

				<form class="login100-form validate-form">
					<span class="login100-form-title">
						Member Login
					</span>

					<div class="wrap-input100 validate-input" data-validate = "Valid email is required: ex@abc.xyz">
						<input class="input100" type="text" name="email" placeholder="Email">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-envelope" aria-hidden="true"><svg class="cl-icon" viewBox="0 0 1792 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M1792 826V32Q1792 -34 1745.0 -81.0Q1698 -128 1632 -128H160Q94 -128 47.0 -81.0Q0 -34 0 32V826Q44 777 101 739Q463 493 598 394Q655 352 690.5 328.5Q726 305 785.0 280.5Q844 256 895 256H896H897Q948 256 1007.0 280.5Q1066 305 1101.5 328.5Q1137 352 1194 394Q1364 517 1692 739Q1749 778 1792 826ZM1792 1120Q1792 1041 1743.0 969.0Q1694 897 1621 846Q1245 585 1153 521Q1143 514 1110.5 490.5Q1078 467 1056.5 452.5Q1035 438 1004.5 420.0Q974 402 947.0 393.0Q920 384 897 384H896H895Q872 384 845.0 393.0Q818 402 787.5 420.0Q757 438 735.5 452.5Q714 467 681.5 490.5Q649 514 639 521Q548 585 377.0 703.5Q206 822 172 846Q110 888 55.0 961.5Q0 1035 0 1098Q0 1176 41.5 1228.0Q83 1280 160 1280H1632Q1697 1280 1744.5 1233.0Q1792 1186 1792 1120Z"/></g></svg></i>
						</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "Password is required">
						<input class="input100" type="password" name="pass" placeholder="Password">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-lock" aria-hidden="true"><svg class="cl-icon" viewBox="0 0 1152 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M320 768H832V960Q832 1066 757.0 1141.0Q682 1216 576.0 1216.0Q470 1216 395.0 1141.0Q320 1066 320 960ZM1152 672V96Q1152 56 1124.0 28.0Q1096 0 1056 0H96Q56 0 28.0 28.0Q0 56 0 96V672Q0 712 28.0 740.0Q56 768 96 768H128V960Q128 1144 260.0 1276.0Q392 1408 576.0 1408.0Q760 1408 892.0 1276.0Q1024 1144 1024 960V768H1056Q1096 768 1124.0 740.0Q1152 712 1152 672Z"/></g></svg></i>
						</span>
					</div>

					<div class="container-login100-form-btn">
						<button class="login100-form-btn">
							Login
						</button>
					</div>

					<div class="cl-text-center p-t-12">
						<span class="txt1">
							Forgot
						</span>
						<a class="txt2" href="#">
							Username / Password?
						</a>
					</div>

					<div class="cl-text-center p-t-136">
						<a class="txt2" href="#">
							Create your Account
							<i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"><svg class="cl-icon" viewBox="0 0 1792 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M1728 643Q1728 629 1718 619L1334 265Q1318 251 1299 259Q1280 268 1280 288V512H32Q18 512 9.0 521.0Q0 530 0 544V736Q0 750 9.0 759.0Q18 768 32 768H1280V992Q1280 1013 1299.0 1021.0Q1318 1029 1334 1016L1718 666Q1728 656 1728 643Z"/></g></svg></i>
						</a>
					</div>
				</form>
			</div>
		</div>
	</div>

		<script src="js/snippet.js"></script>
</body>
</html>
