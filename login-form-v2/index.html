<!DOCTYPE html>
<html lang="en">
<head>
	<title>Login V2</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="icon" type="image/png" href="images/icons/favicon.ico"/>

	<link rel="stylesheet" href="css/style.css">
</head>
<body>

	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<form class="login100-form validate-form">
					<span class="login100-form-title p-b-26">
						Welcome
					</span>
					<span class="login100-form-title p-b-48">
						<i class="zmdi zmdi-font"><svg class="cl-icon" viewBox="0 0 427 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M169 160 213 278 257 160ZM384 405Q402 405 414.5 392.5Q427 380 427 363V21Q427 4 414.5 -8.5Q402 -21 384 -21H43Q25 -21 12.5 -8.5Q0 4 0 21V363Q0 380 12.5 392.5Q25 405 43 405ZM298 53H342L233 331H193L84 53H129L153 117H273Z"/></g></svg></i>
					</span>

					<div class="wrap-input100 validate-input" data-validate = "Valid email is: a@b.c">
						<input class="input100" type="text" name="email">
						<span class="focus-input100" data-placeholder="Email"></span>
					</div>

					<div class="wrap-input100 validate-input" data-validate="Enter password">
						<span class="btn-show-pass">
							<i class="zmdi zmdi-eye"><svg class="cl-icon" data-icon="zmdi-eye" viewBox="0 0 469 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M469 192Q441 121 377.5 76.5Q314 32 235.0 32.0Q156 32 92.0 76.5Q28 121 0 192Q28 263 92.0 307.5Q156 352 235.0 352.0Q314 352 377.5 307.5Q441 263 469 192ZM159.5 116.5Q191 85 235.0 85.0Q279 85 310.0 116.5Q341 148 341.0 192.0Q341 236 310.0 267.5Q279 299 235.0 299.0Q191 299 159.5 267.5Q128 236 128.0 192.0Q128 148 159.5 116.5ZM189.5 237.5Q208 256 234.5 256.0Q261 256 280.0 237.5Q299 219 299.0 192.0Q299 165 280.0 146.5Q261 128 234.5 128.0Q208 128 189.5 146.5Q171 165 171.0 192.0Q171 219 189.5 237.5Z"/></g></svg><svg class="cl-icon" data-icon="zmdi-eye-off" viewBox="0 0 469 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M235 299Q215 299 196 291L150 337Q191 352 234 352Q313 352 377.0 307.5Q441 263 469 192Q446 132 396 91L334 153Q341 172 341 192Q341 236 310.0 267.5Q279 299 235 299ZM21 357 48 384 427 6 400 -21 337 41 328 50Q283 32 235 32Q156 32 92.0 76.5Q28 121 0 192Q25 256 80 298L70 308ZM139 239Q128 216 128 192Q128 148 159.5 116.5Q191 85 235 85Q259 85 282 97L249 130Q241 128 235 128Q208 128 189.5 146.5Q171 165 171 192Q171 199 172 206ZM231 256H235Q261 256 280.0 237.0Q299 218 299 192L298 188Z"/></g></svg></i>
						</span>
						<input class="input100" type="password" name="pass">
						<span class="focus-input100" data-placeholder="Password"></span>
					</div>

					<div class="container-login100-form-btn">
						<div class="wrap-login100-form-btn">
							<div class="login100-form-bgbtn"></div>
							<button class="login100-form-btn">
								Login
							</button>
						</div>
					</div>

					<div class="cl-text-center p-t-115">
						<span class="txt1">
							Don’t have an account?
						</span>

						<a class="txt2" href="#">
							Sign Up
						</a>
					</div>
				</form>
			</div>
		</div>
	</div>

		<script src="js/snippet.js"></script>
</body>
</html>
