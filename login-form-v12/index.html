<!DOCTYPE html>
<html lang="en">
<head>
	<title>Login V12</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="icon" type="image/png" href="images/icons/favicon.ico"/>

	<link rel="stylesheet" href="css/style.css">
</head>
<body>

	<div class="limiter">
		<div class="container-login100" style="background-image: url('images/img-01.jpg');">
			<div class="wrap-login100 p-t-190 p-b-30">
				<form class="login100-form validate-form">
					<div class="login100-form-avatar">
						<img src="images/avatar-01.jpg" alt="AVATAR">
					</div>

					<span class="login100-form-title p-t-20 p-b-45">
						John Doe
					</span>

					<div class="wrap-input100 validate-input m-b-10" data-validate = "Username is required">
						<input class="input100" type="text" name="username" placeholder="Username">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-user"><svg class="cl-icon" viewBox="0 0 1280 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M1280 137Q1280 28 1217.5 -50.0Q1155 -128 1067 -128H213Q125 -128 62.5 -50.0Q0 28 0 137Q0 222 8.5 297.5Q17 373 40.0 449.5Q63 526 98.5 580.5Q134 635 192.5 669.5Q251 704 327 704Q458 576 640.0 576.0Q822 576 953 704Q1029 704 1087.5 669.5Q1146 635 1181.5 580.5Q1217 526 1240.0 449.5Q1263 373 1271.5 297.5Q1280 222 1280 137ZM911.5 1295.5Q1024 1183 1024.0 1024.0Q1024 865 911.5 752.5Q799 640 640.0 640.0Q481 640 368.5 752.5Q256 865 256.0 1024.0Q256 1183 368.5 1295.5Q481 1408 640.0 1408.0Q799 1408 911.5 1295.5Z"/></g></svg></i>
						</span>
					</div>

					<div class="wrap-input100 validate-input m-b-10" data-validate = "Password is required">
						<input class="input100" type="password" name="pass" placeholder="Password">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-lock"><svg class="cl-icon" viewBox="0 0 1152 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M320 768H832V960Q832 1066 757.0 1141.0Q682 1216 576.0 1216.0Q470 1216 395.0 1141.0Q320 1066 320 960ZM1152 672V96Q1152 56 1124.0 28.0Q1096 0 1056 0H96Q56 0 28.0 28.0Q0 56 0 96V672Q0 712 28.0 740.0Q56 768 96 768H128V960Q128 1144 260.0 1276.0Q392 1408 576.0 1408.0Q760 1408 892.0 1276.0Q1024 1144 1024 960V768H1056Q1096 768 1124.0 740.0Q1152 712 1152 672Z"/></g></svg></i>
						</span>
					</div>

					<div class="container-login100-form-btn p-t-10">
						<button class="login100-form-btn">
							Login
						</button>
					</div>

					<div class="cl-text-center w-full p-t-25 p-b-230">
						<a href="#" class="txt1">
							Forgot Username / Password?
						</a>
					</div>

					<div class="cl-text-center w-full">
						<a class="txt1" href="#">
							Create new account
							<i class="fa fa-long-arrow-right"><svg class="cl-icon" viewBox="0 0 1792 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M1728 643Q1728 629 1718 619L1334 265Q1318 251 1299 259Q1280 268 1280 288V512H32Q18 512 9.0 521.0Q0 530 0 544V736Q0 750 9.0 759.0Q18 768 32 768H1280V992Q1280 1013 1299.0 1021.0Q1318 1029 1334 1016L1718 666Q1728 656 1728 643Z"/></g></svg></i>
						</a>
					</div>
				</form>
			</div>
		</div>
	</div>

		<script src="js/snippet.js"></script>
</body>
</html>
