<!doctype html>
<html lang="en">
  <head>
  	<title>Login 02</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

		<link rel="stylesheet" href="css/style.css">
</head>
	<body>
	<section class="ftco-section">
		<div class="cl-container">
			<div class="cl-row cl-justify-content-center">
				<div class="cl-col-md-6 cl-text-center cl-mb-5">
					<h2 class="heading-section">Login #02</h2>
				</div>
			</div>
			<div class="cl-row cl-justify-content-center">
				<div class="cl-col-md-6 cl-col-lg-4">
					<div class="login-wrap cl-p-0">
		      	<h3 class="cl-mb-4 cl-text-center">Sign In</h3>
		      	<form action="#" class="signin-form">
		      		<div class="cl-form-group">
		      			<input type="text" class="cl-form-control" placeholder="Username" required>
		      		</div>
	            <div class="cl-form-group">
	              <input type="password" class="cl-form-control" placeholder="Password" required>
	            </div>
	            <div class="cl-form-group">
	            	<button type="submit" class="cl-form-control cl-btn cl-btn-primary cl-rounded submit cl-px-3">Sign In</button>
	            </div>
	            <div class="cl-form-group cl-d-md-flex">
	            	<div class="cl-w-50">
		            	<label class="checkbox-wrap checkbox-primary">Remember Me
									  <input type="checkbox" checked>
									  <span class="checkmark"></span>
									</label>
								</div>
								<div class="cl-w-50 cl-text-md-right">
									<a href="#" style="color: #fff">Forgot Password</a>
								</div>
	            </div>
	          </form>
	          <p class="cl-w-100 cl-text-center">&mdash; Or Sign In With &mdash;</p>
	          <div class="social cl-d-flex cl-text-center">
	          	<a href="#" class="cl-px-2 cl-py-2 cl-mr-md-1 cl-rounded"><span class="ion-logo-facebook cl-mr-2"></span> Facebook</a>
	          	<a href="#" class="cl-px-2 cl-py-2 cl-ml-md-1 cl-rounded"><span class="ion-logo-twitter cl-mr-2"></span> Twitter</a>
	          </div>
		      </div>
				</div>
			</div>
		</div>
	</section>

	</body>
</html>
