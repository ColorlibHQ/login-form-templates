<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Page V03 | Colorlib</title>
  
  	<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="cl-login03" aria-labelledby="cl-login03-title">
    <div class="cl-login03__glow" aria-hidden="true"></div>

    <a class="cl-login03__brand" href="#" aria-label="Beacon home">
      <svg viewBox="0 0 28 28" width="28" height="28" aria-hidden="true"><defs><linearGradient id="cl-login03-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="28" height="28" rx="8" fill="url(#cl-login03-g)"/><path d="M14 6v6M14 16v6M6 14h6M16 14h6" stroke="#0b0d14" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Beacon</span>
    </a>

    <div class="cl-login03__frame">
      <div class="cl-login03__card">
        <div data-view>
          <h1 class="cl-login03__title" id="cl-login03-title">Log in to Beacon</h1>
          <p class="cl-login03__sub">Incident response for teams on call.</p>

          <div class="cl-login03__sso">
            <button class="cl-login03__sso-btn" type="button" data-provider="Google">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
              Continue with Google
            </button>
            <button class="cl-login03__sso-btn" type="button" data-provider="GitHub">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M13.5 4.5l-3 15"/></svg>
              Continue with GitHub
            </button>
            <button class="cl-login03__sso-btn" type="button" aria-expanded="false" aria-controls="cl-login03-saml" data-saml-toggle>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V7l8-4 8 4v14"/><path d="M9 21v-5h6v5M9 10h.01M15 10h.01M12 10h.01"/></svg>
              Continue with SAML SSO
              <svg class="cl-login03__chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>

          <form class="cl-login03__saml" id="cl-login03-saml" data-saml novalidate hidden>
            <div class="cl-login03__field" data-field>
              <label class="cl-login03__label" for="cl-login03-domain">Company domain</label>
              <div class="cl-login03__inline">
                <input class="cl-login03__input" id="cl-login03-domain" name="domain" type="text" inputmode="url" autocomplete="organization" required pattern="[a-zA-Z0-9\-]+(\.[a-zA-Z0-9\-]+)+" placeholder="acme.com" data-msg="Enter your company domain, like acme.com." data-pattern="Use a domain like acme.com, without https://." aria-describedby="cl-login03-domain-err">
                <button class="cl-login03__go" type="submit">Continue</button>
              </div>
              <p class="cl-login03__error" id="cl-login03-domain-err" data-error></p>
            </div>
          </form>

          <p class="cl-login03__or"><span>or with email</span></p>

          <form class="cl-login03__form" data-form novalidate>
            <div class="cl-login03__field" data-field>
              <label class="cl-login03__label" for="cl-login03-email">Work email</label>
              <input class="cl-login03__input" id="cl-login03-email" name="email" type="email" autocomplete="username" required placeholder="alex@company.com" data-msg="Enter your work email." aria-describedby="cl-login03-email-err">
              <p class="cl-login03__error" id="cl-login03-email-err" data-error></p>
            </div>
            <div class="cl-login03__field" data-field>
              <div class="cl-login03__row">
                <label class="cl-login03__label" for="cl-login03-pw">Password</label>
                <a class="cl-login03__link" href="#">Reset password</a>
              </div>
              <div class="cl-login03__pw">
                <input class="cl-login03__input" id="cl-login03-pw" name="password" type="password" autocomplete="current-password" required minlength="10" data-msg="Enter your password." aria-describedby="cl-login03-pw-err">
                <button class="cl-login03__eye" type="button" aria-label="Show password" aria-pressed="false" aria-controls="cl-login03-pw" data-pw-toggle>
                  <svg class="cl-login03__eye-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="cl-login03__eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
              <p class="cl-login03__error" id="cl-login03-pw-err" data-error></p>
            </div>
            <button class="cl-login03__submit" type="submit">Log in</button>
          </form>
        </div>

        <div class="cl-login03__done" data-success tabindex="-1" hidden>
          <span class="cl-login03__pulse" aria-hidden="true"></span>
          <h2 class="cl-login03__title" data-done-title>Welcome back</h2>
          <p class="cl-login03__sub" data-done-text></p>
          <button class="cl-login03__ghost" type="button" data-reset>Back to log in</button>
        </div>

        <div class="cl-login03__live" role="status" aria-live="polite" data-live></div>
      </div>
    </div>

    <p class="cl-login03__foot">New team? <a class="cl-login03__link" href="#">Start a 14-day trial</a> <span aria-hidden="true">&middot;</span> <span class="cl-login03__demo">Demo &mdash; nothing is sent.</span></p>
  </main>
	<script src="js/snippet.js"></script>
</body>
</html>
