<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Page V04 | Colorlib</title>
  
  	<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="cl-login04">
    <img class="cl-login04__bg" src="images/backdrop.jpg" width="1200" height="800" alt="">

    <div class="cl-login04__intro">
      <a class="cl-login04__brand" href="#" aria-label="Kaleido home">
        <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="#fb7185"/><circle cx="20" cy="12" r="8" fill="#38bdf8" fill-opacity=".85"/><circle cx="16" cy="19" r="8" fill="#facc15" fill-opacity=".85"/></svg>
        <span>Kaleido</span>
      </a>
      <p class="cl-login04__kicker">Colour library for design teams</p>
      <p class="cl-login04__headline">Every palette your team has ever loved, in one place.</p>
      <ul class="cl-login04__chips" aria-label="Recent palettes">
        <li><span style="background:#fb7185"></span><span style="background:#f97316"></span><span style="background:#facc15"></span>Sunset market</li>
        <li><span style="background:#0ea5e9"></span><span style="background:#6366f1"></span><span style="background:#a855f7"></span>Night swim</li>
      </ul>
    </div>

    <section class="cl-login04__glass" aria-labelledby="cl-login04-title">
      <div data-view>
        <h1 class="cl-login04__title" id="cl-login04-title">Sign in</h1>
        <p class="cl-login04__sub">Good to see you again.</p>

        <form class="cl-login04__form" data-form novalidate>
          <div class="cl-login04__field" data-field>
            <label class="cl-login04__label" for="cl-login04-email">Email address</label>
            <input class="cl-login04__input" id="cl-login04-email" name="email" type="email" autocomplete="username" required placeholder="you@studio.com" data-msg="Enter your email address." aria-describedby="cl-login04-email-err">
            <p class="cl-login04__error" id="cl-login04-email-err" data-error></p>
          </div>
          <div class="cl-login04__field" data-field>
            <label class="cl-login04__label" for="cl-login04-pw">Password</label>
            <div class="cl-login04__pw">
              <input class="cl-login04__input" id="cl-login04-pw" name="password" type="password" autocomplete="current-password" required minlength="8" data-msg="Enter your password." aria-describedby="cl-login04-pw-err">
              <button class="cl-login04__eye" type="button" aria-label="Show password" aria-pressed="false" aria-controls="cl-login04-pw" data-pw-toggle>
                <svg class="cl-login04__eye-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="cl-login04__eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
            <p class="cl-login04__error" id="cl-login04-pw-err" data-error></p>
          </div>

          <div class="cl-login04__row">
            <label class="cl-login04__check"><input type="checkbox" name="remember"> <span>Remember me</span></label>
            <a class="cl-login04__link" href="#">Forgot password?</a>
          </div>

          <button class="cl-login04__submit" type="submit">
            Sign in
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>

        <p class="cl-login04__or"><span>or continue with</span></p>
        <div class="cl-login04__social">
          <button class="cl-login04__icon-btn" type="button" aria-label="Continue with Google" data-provider="Google">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
          </button>
          <button class="cl-login04__icon-btn" type="button" aria-label="Continue with Apple" data-provider="Apple">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg>
          </button>
          <button class="cl-login04__icon-btn" type="button" aria-label="Continue with Figma" data-provider="Figma">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19c-4 0-7-2.7-7-6.5S8.5 5 12.5 5 19 7.5 19 10.5c0 2-1.5 3-3 3h-2a2 2 0 0 0-1.4 3.4c.8.8.4 2.1-.6 2.1Z"/><circle cx="8.5" cy="12" r="1"/><circle cx="11" cy="8.5" r="1"/><circle cx="15" cy="8.5" r="1"/></svg>
          </button>
        </div>
        <p class="cl-login04__foot">New to Kaleido? <a class="cl-login04__link" href="#">Create an account</a></p>
      </div>

      <div class="cl-login04__done" data-success tabindex="-1" hidden>
        <span class="cl-login04__swatches" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <h2 class="cl-login04__title" data-done-title>Welcome back</h2>
        <p class="cl-login04__sub" data-done-text></p>
        <button class="cl-login04__ghost" type="button" data-reset>Sign out</button>
      </div>

      <div class="cl-login04__live" role="status" aria-live="polite" data-live></div>
      <p class="cl-login04__demo">Demo &mdash; nothing is sent.</p>
    </section>
  </main>
	<script src="js/snippet.js"></script>
</body>
</html>
