	              <input type="password" class="cl-form-control cl-rounded-left" placeholder="Password" required>
	            </div>
	            <div class="cl-form-group cl-d-flex cl-align-items-center">
	            	<div class="cl-w-100">
	            		<label class="checkbox-wrap checkbox-primary cl-mb-0">Save Password

									  <span class="checkmark"></span>

								</div>
								<div class="cl-w-100 cl-d-flex cl-justify-content-end">
		            	<button type="submit" class="cl-btn cl-btn-primary cl-rounded submit">Login</button>
	            	</div>
	            </div>
	            <div class="cl-form-group cl-mt-4">
								<div class="cl-w-100 cl-text-center">
									<p class="cl-mb-1">Don't have an account? <a href="#">Sign Up</a></p>

	            </div>

				</div>
			</div>
		</div>
