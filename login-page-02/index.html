<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Page V02 | Colorlib</title>
  
  	<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="cl-login02-demo">
    <section class="cl-login02" aria-labelledby="cl-login02-title">
      <div class="cl-login02__card">
        <span class="cl-login02__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3c5 0 9 3.6 9 8.5S17 20 12 20c-4.6 0-9-2.8-9-7.5S7 3 12 3Z" fill="#fff"/><circle cx="15" cy="10" r="2" fill="#0a0a0a"/></svg>
        </span>

        <div data-view="form">
          <h1 class="cl-login02__title" id="cl-login02-title">Sign in to Pebble</h1>
          <p class="cl-login02__sub" data-sub>Welcome back. Use a passkey, or your email.</p>

          <button class="cl-login02__passkey" type="button" data-passkey>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="4"/><path d="M2 20c0-3.3 2.7-6 6-6 1.3 0 2.5.4 3.5 1.1"/><circle cx="17.5" cy="13.5" r="2.5"/><path d="M17.5 16v5l1.5-1.2M17.5 18.5H19"/></svg>
            <span data-passkey-label>Sign in with a passkey</span>
          </button>

          <p class="cl-login02__or"><span>or</span></p>

          <form class="cl-login02__form" data-form novalidate>
            <div class="cl-login02__field" data-field>
              <label class="cl-login02__label" for="cl-login02-email">Email</label>
              <input class="cl-login02__input" id="cl-login02-email" name="email" type="email" autocomplete="username webauthn" required placeholder="you@company.com" data-msg="Enter your email address." aria-describedby="cl-login02-email-err">
              <p class="cl-login02__error" id="cl-login02-email-err" data-error></p>
            </div>

            <div class="cl-login02__field" data-field data-pw-field>
              <div class="cl-login02__row">
                <label class="cl-login02__label" for="cl-login02-pw">Password</label>
                <a class="cl-login02__link" href="#">Forgot?</a>
              </div>
              <div class="cl-login02__pw">
                <input class="cl-login02__input" id="cl-login02-pw" name="password" type="password" autocomplete="current-password" required minlength="8" data-msg="Enter your password, or email yourself a link." aria-describedby="cl-login02-pw-err">
                <button class="cl-login02__eye" type="button" aria-label="Show password" aria-pressed="false" aria-controls="cl-login02-pw" data-pw-toggle>
                  <svg class="cl-login02__eye-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="cl-login02__eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
              <p class="cl-login02__error" id="cl-login02-pw-err" data-error></p>
            </div>

            <p class="cl-login02__hint" data-link-hint hidden>We&rsquo;ll email you a one-time link. It works once, for 15 minutes.</p>

            <button class="cl-login02__submit" type="submit" data-submit>Continue</button>
          </form>

          <button class="cl-login02__mode" type="button" data-mode>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></svg>
            <span data-mode-label>Email me a sign-in link instead</span>
          </button>
        </div>

        <div class="cl-login02__done" data-success tabindex="-1" hidden>
          <span class="cl-login02__done-icon" aria-hidden="true" data-done-icon></span>
          <h2 class="cl-login02__title" data-done-title>You&rsquo;re in</h2>
          <p class="cl-login02__sub" data-done-text></p>
          <div class="cl-login02__done-actions">
            <button class="cl-login02__ghost" type="button" data-resend hidden>Resend link</button>
            <button class="cl-login02__ghost" type="button" data-reset>Use a different email</button>
          </div>
        </div>

        <div class="cl-login02__live" role="status" aria-live="polite" data-live></div>
      </div>

      <p class="cl-login02__foot">No account yet? <a class="cl-login02__link" href="#">Create one</a></p>
      <p class="cl-login02__demo">Demo &mdash; nothing is sent, and the passkey prompt is simulated.</p>
    </section>
  </main>
	<script src="js/snippet.js"></script>
</body>
</html>
