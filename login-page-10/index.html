<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Page V10 | Colorlib</title>
  
  	<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="cl-login10-demo">
    <section class="cl-login10" aria-label="Loop account">
      <header class="cl-login10__head">
        <span class="cl-login10__logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="32" height="32"><circle cx="16" cy="16" r="16" fill="#18181b"/><path d="M10 16a6 6 0 1 1 6 6" fill="none" stroke="#c4b5fd" stroke-width="3.2" stroke-linecap="round"/><circle cx="16" cy="22" r="2.4" fill="#fda4af"/></svg>
        </span>
        <p class="cl-login10__brand">Loop</p>
        <p class="cl-login10__tagline">Small habits, tracked kindly.</p>
      </header>

      <div class="cl-login10__tabs" role="tablist" aria-label="Log in or create an account" data-tablist>
        <span class="cl-login10__thumb" aria-hidden="true"></span>
        <button class="cl-login10__tab" type="button" role="tab" id="cl-login10-tab-login" aria-controls="cl-login10-panel-login" aria-selected="true">Log in</button>
        <button class="cl-login10__tab" type="button" role="tab" id="cl-login10-tab-signup" aria-controls="cl-login10-panel-signup" aria-selected="false" tabindex="-1">Create account</button>
      </div>

      <div class="cl-login10__panels">
        <div class="cl-login10__panel" role="tabpanel" id="cl-login10-panel-login" aria-labelledby="cl-login10-tab-login" tabindex="0">
          <form class="cl-login10__form" data-form="login" novalidate>
            <h1 class="cl-login10__title">Welcome back</h1>
            <div class="cl-login10__field" data-field>
              <label class="cl-login10__label" for="cl-login10-l-email">Email</label>
              <input class="cl-login10__input" id="cl-login10-l-email" name="email" type="email" autocomplete="username" required data-msg="Enter your email." aria-describedby="cl-login10-l-email-err">
              <p class="cl-login10__error" id="cl-login10-l-email-err" data-error></p>
            </div>
            <div class="cl-login10__field" data-field>
              <div class="cl-login10__row">
                <label class="cl-login10__label" for="cl-login10-l-pw">Password</label>
                <a class="cl-login10__link" href="#">Forgot it?</a>
              </div>
              <div class="cl-login10__pw">
                <input class="cl-login10__input" id="cl-login10-l-pw" name="password" type="password" autocomplete="current-password" required minlength="8" data-msg="Enter your password." aria-describedby="cl-login10-l-pw-err">
                <button class="cl-login10__eye" type="button" aria-label="Show password" aria-pressed="false" aria-controls="cl-login10-l-pw" data-pw-toggle>
                  <svg class="cl-login10__eye-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="cl-login10__eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
              <p class="cl-login10__error" id="cl-login10-l-pw-err" data-error></p>
            </div>
            <button class="cl-login10__submit" type="submit">Log in</button>
            <p class="cl-login10__swap">New to Loop? <button class="cl-login10__swap-btn" type="button" data-go="signup">Create an account</button></p>
          </form>
        </div>

        <div class="cl-login10__panel" role="tabpanel" id="cl-login10-panel-signup" aria-labelledby="cl-login10-tab-signup" tabindex="0" hidden>
          <form class="cl-login10__form" data-form="signup" novalidate>
            <h2 class="cl-login10__title">Start your first streak</h2>
            <div class="cl-login10__field" data-field>
              <label class="cl-login10__label" for="cl-login10-s-name">Your name</label>
              <input class="cl-login10__input" id="cl-login10-s-name" name="name" type="text" autocomplete="name" required minlength="2" data-msg="Tell us what to call you." aria-describedby="cl-login10-s-name-err">
              <p class="cl-login10__error" id="cl-login10-s-name-err" data-error></p>
            </div>
            <div class="cl-login10__field" data-field>
              <label class="cl-login10__label" for="cl-login10-s-email">Email</label>
              <input class="cl-login10__input" id="cl-login10-s-email" name="email" type="email" autocomplete="email" required data-msg="Enter your email." aria-describedby="cl-login10-s-email-err">
              <p class="cl-login10__error" id="cl-login10-s-email-err" data-error></p>
            </div>
            <div class="cl-login10__field" data-field>
              <label class="cl-login10__label" for="cl-login10-s-pw">Create a password</label>
              <div class="cl-login10__pw">
                <input class="cl-login10__input" id="cl-login10-s-pw" name="password" type="password" autocomplete="new-password" required minlength="8" pattern="(?=.*\d).{8,}" data-msg="Create a password." data-pattern="Add at least one number." aria-describedby="cl-login10-s-pw-hint cl-login10-s-pw-err">
                <button class="cl-login10__eye" type="button" aria-label="Show password" aria-pressed="false" aria-controls="cl-login10-s-pw" data-pw-toggle>
                  <svg class="cl-login10__eye-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="cl-login10__eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
              <p class="cl-login10__hint" id="cl-login10-s-pw-hint">At least 8 characters, including a number.</p>
              <p class="cl-login10__error" id="cl-login10-s-pw-err" data-error></p>
            </div>
            <div class="cl-login10__field" data-field>
              <label class="cl-login10__check">
                <input type="checkbox" name="terms" required data-msg="Please accept the terms to continue." aria-describedby="cl-login10-s-terms-err">
                <span>I agree to the <a class="cl-login10__link" href="#">Terms</a> and <a class="cl-login10__link" href="#">Privacy Policy</a></span>
              </label>
              <p class="cl-login10__error" id="cl-login10-s-terms-err" data-error></p>
            </div>
            <button class="cl-login10__submit" type="submit">Create account</button>
            <p class="cl-login10__swap">Already have one? <button class="cl-login10__swap-btn" type="button" data-go="login">Log in</button></p>
          </form>
        </div>

        <div class="cl-login10__done" data-success tabindex="-1" hidden>
          <span class="cl-login10__streak" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </span>
          <h2 class="cl-login10__title" data-done-title></h2>
          <p class="cl-login10__sub" data-done-text></p>
          <button class="cl-login10__swap-btn" type="button" data-reset>Back to start</button>
        </div>
      </div>

      <div class="cl-login10__vh" role="status" aria-live="polite" data-live></div>
      <p class="cl-login10__demo">Demo &mdash; nothing is sent.</p>
    </section>
  </main>
	<script src="js/snippet.js"></script>
</body>
</html>
