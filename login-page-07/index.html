<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Page V07 | Colorlib</title>
  
  	<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="cl-login07-demo">
    <section class="cl-login07" aria-labelledby="cl-login07-title">
      <div class="cl-login07__status" aria-hidden="true">
        <span>9:41</span>
        <span class="cl-login07__island"></span>
        <span class="cl-login07__icons">
          <svg viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="2" width="3" height="10" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
          <svg viewBox="0 0 26 12" width="26" height="12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
        </span>
      </div>

      <div class="cl-login07__hero" aria-hidden="true">
        <svg class="cl-login07__track" viewBox="0 0 390 220" preserveAspectRatio="none">
          <path d="M-10 100C60 50 120 130 200 80S330 10 400 40" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="18" stroke-linecap="round"/>
          <path d="M-10 100C60 50 120 130 200 80S330 10 400 40" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="10 12"/>
          <circle cx="200" cy="80" r="10" fill="#fff"/><circle cx="200" cy="80" r="5" fill="#ff5a36"/>
        </svg>
        <div class="cl-login07__stats">
          <span><strong>5.2</strong> km</span>
          <span><strong>5&prime;12&Prime;</strong> /km</span>
          <span><strong>27</strong> min</span>
        </div>
      </div>

      <div class="cl-login07__sheet">
        <div data-view>
          <span class="cl-login07__app">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4a2 2 0 1 0 0 .1M9 21l2-6 3 2v5M7 12l3-4 4 1 3 3 3 1"/></svg>
            Stride
          </span>
          <h1 class="cl-login07__title" id="cl-login07-title">Welcome back</h1>
          <p class="cl-login07__sub">Log in to sync today&rsquo;s run.</p>

          <form class="cl-login07__form" data-form novalidate>
            <div class="cl-login07__field" data-field>
              <label class="cl-login07__label" for="cl-login07-email">Email</label>
              <input class="cl-login07__input" id="cl-login07-email" name="email" type="email" inputmode="email" autocapitalize="off" autocomplete="username" required placeholder="sam@example.com" data-msg="Enter your email." aria-describedby="cl-login07-email-err">
              <p class="cl-login07__error" id="cl-login07-email-err" data-error></p>
            </div>
            <div class="cl-login07__field" data-field>
              <label class="cl-login07__label" for="cl-login07-pw">Password</label>
              <div class="cl-login07__pw">
                <input class="cl-login07__input" id="cl-login07-pw" name="password" type="password" autocomplete="current-password" required minlength="8" data-msg="Enter your password." aria-describedby="cl-login07-pw-err">
                <button class="cl-login07__eye" type="button" aria-label="Show password" aria-pressed="false" aria-controls="cl-login07-pw" data-pw-toggle>
                  <svg class="cl-login07__eye-on" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="cl-login07__eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
              <p class="cl-login07__error" id="cl-login07-pw-err" data-error></p>
            </div>

            <div class="cl-login07__switch-row">
              <label class="cl-login07__switch-label" for="cl-login07-stay">Stay logged in</label>
              <input class="cl-login07__switch" id="cl-login07-stay" type="checkbox" role="switch" name="stay" checked>
            </div>

            <button class="cl-login07__submit" type="submit">Log in</button>
          </form>

          <button class="cl-login07__faceid" type="button" data-faceid>
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M9 9v1M15 9v1M12 9v4h-1M9 16c1.8 1.3 4.2 1.3 6 0"/></svg>
            Use Face ID
            <span class="cl-login07__badge">Demo</span>
          </button>

          <p class="cl-login07__foot"><a class="cl-login07__link" href="#">Forgot password?</a> <span aria-hidden="true">&middot;</span> <a class="cl-login07__link" href="#">Create account</a></p>
        </div>

        <div class="cl-login07__done" data-success tabindex="-1" hidden>
          <span class="cl-login07__ring" aria-hidden="true"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
          <h2 class="cl-login07__title" data-done-title>You&rsquo;re in</h2>
          <p class="cl-login07__sub" data-done-text></p>
          <button class="cl-login07__submit" type="button" data-reset>Log out</button>
        </div>

        <div class="cl-login07__scan" data-scan hidden>
          <span class="cl-login07__scan-face" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M9 9v1M15 9v1M12 9v4h-1M9 16c1.8 1.3 4.2 1.3 6 0"/></svg>
          </span>
          <p class="cl-login07__scan-text">Face ID (simulated)</p>
        </div>

        <div class="cl-login07__vh" role="status" aria-live="polite" data-live></div>
        <p class="cl-login07__demo">Demo &mdash; nothing is sent and no camera is used.</p>
      </div>
      <span class="cl-login07__home" aria-hidden="true"></span>
    </section>
  </main>
	<script src="js/snippet.js"></script>
</body>
</html>
