		      	<h3 class="cl-text-center cl-mb-4">Sign In</h3>
						<form action="#" class="login-form">
		      		<div class="cl-form-group">
		      			<input type="text" class="cl-form-control cl-rounded-left" placeholder="Username" required>
		      		</div>
	            <div class="cl-form-group cl-d-flex">
	              <input type="password" class="cl-form-control cl-rounded-left" placeholder="Password" required>
	            </div>
	            <div class="cl-form-group">
	            	<button type="submit" class="cl-form-control cl-btn cl-btn-primary cl-rounded submit cl-px-3">Login</button>
	            </div>
	            <div class="cl-form-group cl-d-md-flex">
	            	<div class="cl-w-50">
	            		<label class="checkbox-wrap checkbox-primary">Remember Me
									  <input type="checkbox" checked>
									  <span class="checkmark"></span>
									</label>
								</div>
								<div class="cl-w-50 cl-text-md-right">
									<a href="#">Forgot Password</a>
								</div>
	            </div>
	          </form>
	        </div>
				</div>
			</div>
		</div>
