	<section class="ftco-section">

		      			<input type="text" class="cl-form-control" placeholder="Username" required>
		      		</div>
	            <div class="cl-form-group">
	            	<div class="icon cl-d-flex cl-align-items-center cl-justify-content-center"><span class="fa fa-lock"><svg class="cl-icon" viewBox="0 0 1152 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M320 768H832V960Q832 1066 757.0 1141.0Q682 1216 576.0 1216.0Q470 1216 395.0 1141.0Q320 1066 320 960ZM1152 672V96Q1152 56 1124.0 28.0Q1096 0 1056 0H96Q56 0 28.0 28.0Q0 56 0 96V672Q0 712 28.0 740.0Q56 768 96 768H128V960Q128 1144 260.0 1276.0Q392 1408 576.0 1408.0Q760 1408 892.0 1276.0Q1024 1144 1024 960V768H1056Q1096 768 1124.0 740.0Q1152 712 1152 672Z"/></g></svg></span></div>
	              <input type="password" class="cl-form-control" placeholder="Password" required>
	            </div>
	            <div class="cl-form-group cl-d-md-flex">
								<div class="cl-w-100 cl-text-md-right">
									<a href="#">Forgot Password</a>
								</div>
	            </div>
	            <div class="cl-form-group">
	            	<button type="submit" class="cl-btn cl-form-control cl-btn-primary cl-rounded submit cl-px-3">Get Started</button>
	            </div>
	          </form>
	          <div class="cl-w-100 cl-text-center cl-mt-4 text">
	          	<p class="cl-mb-0">Don't have an account?</p>
		          <a href="#">Sign Up</a>
	          </div>
	        </div>
				</div>
			</div>
		</div>
	</section>

	</body>
</html>
